# Pings the live demo once a day so the Supabase free-tier project is never
# paused for inactivity (Supabase pauses free projects after ~7 idle days).
# Also lets you see at a glance whether the hosted demo is up.
name: Keep demo alive

on:
  schedule:
    - cron: '17 3 * * *' # every day at 03:17 UTC (08:47 IST)
  workflow_dispatch: {}  # "Run workflow" button for a manual check

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint (touches the database)
        run: |
          curl --fail --silent --show-error --max-time 30 \
               --retry 3 --retry-delay 20 --retry-all-errors \
               https://fleetspend-ai.vercel.app/api/health
          echo
      - name: Ping home page
        run: curl --fail --silent --show-error --max-time 30 -o /dev/null -w "home %{http_code}\n" https://fleetspend-ai.vercel.app/
